name: Keep backend awake

# Render's free tier spins the service down after ~15 minutes without
# traffic; the next request then pays a 10-20 s cold start. Pinging the
# health endpoint every 10 minutes keeps the instance warm around the clock.
on:
  schedule:
    # Offset minutes instead of */10 — runs scheduled exactly on :00/:10/:20
    # hit GitHub's busiest slots and get delayed or dropped.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        # Generous timeout and retries: if a delayed schedule let the server
        # fall asleep, the ping itself absorbs the cold start.
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --max-time 60 \
            https://zucker-zimt.onrender.com/api/health
